name: CI - Lint, Test and Build

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

jobs:
    ci:
        name: Lint, Test and Build
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
                    POSTGRES_DB: test_db
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Install pnpm
              uses: pnpm/action-setup@fe52b4bb9d799f7716d326843d117a710f1a00e1 # v4.1.0
              with:
                  version: latest

            - name: config node.js 20
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "pnpm"
                  cache-dependency-path: backend/pnpm-lock.yaml

            - name: Install dependencies
              working-directory: ./backend
              run: pnpm install --frozen-lockfile

            - name: Type-check
              working-directory: ./backend
              run: pnpm run type-check

            - name: Lint
              working-directory: ./backend
              run: pnpm run lint

            - name: Unit Tests
              working-directory: ./backend
              env:
                  NODE_ENV: test
                  DB_HOST: localhost
                  DB_PORT: 5432
                  DB_USER: test_user
                  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
                  DB_NAME: test_db
                  REDIS_HOST: localhost
                  REDIS_PORT: 6379
              run: pnpm test

            - name: Build NestJS
              working-directory: ./backend
              run: pnpm build

    docker:
        name: Docker build and push
        runs-on: ubuntu-lastest
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        needs: ci
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Log in to Docker Hub
              uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Metadata (tags)
              id: meta
              uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
              with:
                  images: ${{ secrets.DOCKER_USERNAME }}/mineroyale-backend
                  tags: |
                      type=raw,value=latest
                      type=sha,prefix=sha-

            - name: Build and push # production stage
              uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
              with:
                  context: ./backend
                  target: production
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}

    sonarqube:
        name: Análisis de SonarCloud
        runs-on: ubuntu-latest
        needs: ci # Espera a que pasen lint, test y build
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Necesario para que SonarCloud analice el historial

            - name: Setup pnpm
              uses: pnpm/action-setup@fe52b4bb9d799f7716d326843d117a710f1a00e1 # v4.1.0
              with:
                  version: latest

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "pnpm"
                  cache-dependency-path: backend/pnpm-lock.yaml

            - name: Install dependencies
              working-directory: ./backend
              run: pnpm install --frozen-lockfile

            - name: Run tests with coverage
              working-directory: ./backend
              env:
                  NODE_ENV: test
                  DB_HOST: localhost
                  DB_PORT: 5432
                  DB_USER: test_user
                  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
                  DB_NAME: test_db
                  REDIS_HOST: localhost
                  REDIS_PORT: 6379
              run: pnpm test:cov # Genera coverage/lcov.info

            - name: SonarCloud Scan
              working-directory: ./backend
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                  # No necesitas SONAR_HOST_URL para SonarCloud
              run: ./node_modules/.bin/sonar-scanner
