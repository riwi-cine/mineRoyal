# Configuración para SonarCloud Automatic Analysis (proyecto riwi-cine_mineRoyal).
# Las rutas son relativas a la raíz del repositorio.

sonar.sources=backend/src
sonar.tests=backend/src,backend/test
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.e2e-spec.ts

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.d.ts

# Detección de duplicados (CPD):
# - Las migraciones de TypeORM son DDL declarativo (createTable/columns) y por
#   naturaleza repiten la misma estructura; no son código refactorizable.
# - Los tests repiten fixtures/arrange intencionalmente para mantenerse legibles.
sonar.cpd.exclusions=backend/src/infrastructure/database/migrations/**,**/*.spec.ts,**/*.test.ts,**/*.e2e-spec.ts

sonar.sourceEncoding=UTF-8

