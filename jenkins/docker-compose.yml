services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins-ci
    user: "1000:1000"
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./casc.yaml:/var/jenkins_home/casc.yaml:ro
      - ./jenkins-plugins.txt:/usr/share/jenkins/ref/plugins.txt:ro
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Dhudson.plugins.git.GitSCM.GIT_SHALLOW_CLONE=true
      - CASC_JENKINS_CONFIG=/var/jenkins_home/casc.yaml
      - DOCKER_HOST=tcp://docker-dind:2375
    restart: unless-stopped
    depends_on:
      - docker-dind
    networks:
      - jenkins-net

  # Daemon de Docker aislado para proveer agentes efímeros sin montar docker.sock en el controlador
  docker-dind:
    image: docker:27-dind
    container_name: jenkins-docker-dind
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=""
    volumes:
      - jenkins_docker_certs:/certs/client
      - jenkins_docker_data:/var/lib/docker
    expose:
      - "2375"
    networks:
      - jenkins-net
    restart: unless-stopped

volumes:
  jenkins_home:
  jenkins_docker_certs:
  jenkins_docker_data:

networks:
  jenkins-net:
    driver: bridge
