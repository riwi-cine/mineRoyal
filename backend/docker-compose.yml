services:
  app:
    build:
      context: .
      target: development
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      - NODE_ENV=development
      - NODE_OPTIONS=--max-old-space-size=1536
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - .:/app:z
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - multicine-net
    restart: unless-stopped
    healthcheck:
      # Usamos wget nativo de Alpine para evitar fallos con curl
      # 127.0.0.1 fuerza IPv4 (localhost resuelve a ::1 donde la app no escucha)
      test: ['CMD', 'wget', '-qO-', '--timeout=5', 'http://127.0.0.1:3000/api/v2/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    env_file: .env
    environment:
      - POSTGRES_USER=${DB_USERNAME:-${DB_USER:-postgres}}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-mineroyal}
    ports:
      - '5433:5432' # Expuesto en el puerto 5433 en el host para evitar colisiones locales
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - multicine-net
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-${DB_USER:-postgres}} -d ${DB_NAME:-mineroyal}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    networks:
      - multicine-net
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    image: mineroyal-jenkins:lts
    container_name: jenkins-ci
    user: "1000:1000"
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./jenkins/casc.yaml:/var/jenkins_home/casc.yaml:ro
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Dhudson.plugins.git.GitSCM.GIT_SHALLOW_CLONE=true
      - CASC_JENKINS_CONFIG=/var/jenkins_home/casc.yaml
      - DOCKER_HOST=tcp://docker-dind:2375
      - JENKINS_ADMIN_ID=${JENKINS_ADMIN_ID:-admin}
      - JENKINS_ADMIN_PASSWORD=${JENKINS_ADMIN_PASSWORD:-admin123}
    restart: unless-stopped
    depends_on:
      - docker-dind
    networks:
      - multicine-net

  docker-dind:
    image: docker:27-dind
    container_name: jenkins-docker-dind
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=""
    volumes:
      - jenkins_docker_certs:/certs/client
      - jenkins_docker_data:/var/lib/docker
    expose:
      - "2375"
    networks:
      - multicine-net
    restart: unless-stopped

networks:
  multicine-net:
    driver: bridge

volumes:
  pgdata:
  backend_node_modules:
  jenkins_home:
  jenkins_docker_certs:
  jenkins_docker_data:
