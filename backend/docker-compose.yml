services:
  app:
    build:
      context: .
      target: development
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      - NODE_ENV=development
      - NODE_OPTIONS=--max-old-space-size=1536
      - DB_HOST=postgres
      - DB_PORT=5432
    volumes:
      - .:/app:z
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - multicine-net
    restart: unless-stopped
    healthcheck:
      # Usamos wget nativo de Alpine para evitar fallos con curl
      # 127.0.0.1 fuerza IPv4 (localhost resuelve a ::1 donde la app no escucha)
      test: ['CMD', 'wget', '-qO-', '--timeout=5', 'http://127.0.0.1:3000/api/v2/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    env_file: .env
    environment:
      - POSTGRES_USER=${DB_USERNAME:-${DB_USER:-postgres}}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-mineroyal}
    ports:
      - '5433:5432' # Expuesto en el puerto 5433 en el host para evitar colisiones locales
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - multicine-net
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-${DB_USER:-postgres}}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    networks:
      - multicine-net
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  multicine-net:
    driver: bridge

volumes:
  pgdata:
  backend_node_modules:
