# INFO del proyecto
sonar.projectKey=riwi-cine-api
sonar.projectName=mineRoyal
sonar.projectVersion=1.0

# Configuración para SonarCloud
sonar.organization=riwi-cine

# Código fuente y tests
sonar.sources=src
sonar.tests=src,test

# Configuración de tests y cobertura (Vitest)
sonar.test.inclusions=src/**/*.spec.ts,src/**/*.test.ts,test/**/*.spec.ts,test/**/*.e2e-spec.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusiones de cobertura y análisis
sonar.coverage.exclusions=**/*.d.ts,**/node_modules/**,**/dist/**,**/*.config.ts,**/*.spec.ts,**/*.test.ts,**/*.e2e-spec.ts,src/infrastructure/database/migrations/**,src/infrastructure/database/seeders/**,src/main.ts,src/**/*.module.ts,src/**/dao/**,src/**/*.dao.ts,src/infrastructure/database/datasource.ts
sonar.exclusions=**/*.d.ts,**/node_modules/**,**/dist/**,**/*.spec.ts,**/*.test.ts,**/*.e2e-spec.ts

# Duplicados: migraciones (DDL repetitivo), seeders y tests (fixtures) no cuentan
sonar.cpd.exclusions=src/infrastructure/database/migrations/**,src/infrastructure/database/seeders/**,**/*.spec.ts,**/*.test.ts,**/*.e2e-spec.ts

# Otros ajustes útiles
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git