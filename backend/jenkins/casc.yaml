jenkins:
  systemMessage: "MineRoyal CI/CD Automated Server (JCasC Managed)"
  numExecutors: 0
  mode: EXCLUSIVE
  scmCheckoutRetryCount: 3
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD:-admin123}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  clouds:
    - docker:
        name: "docker-agents"
        dockerApi:
          dockerHost:
            uri: "tcp://docker-dind:2375"
        templates:
          - name: "jenkins-ephemeral-agent"
            labelString: "docker-agent"
            dockerTemplateBase:
              image: "jenkins-node-agent:latest"
              pullCredentialsId: ""
            remoteFs: "/home/jenkins/agent"
            connector:
              attach: {}
            instanceCapStr: "5"
            retentionStrategy:
              idleMinutes: 10

unclassified:
  location:
    url: "http://localhost:8080/"
